# Временная конфигурация для получения SSL сертификата
# После получения сертификата переименуйте chatwoot.conf.disabled в chatwoot.conf
# и удалите этот файл

server {
    listen 80;
    server_name chatwoot.udobno.tech;

    client_max_body_size 50M;

    # Для Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Временно проксируем на Rails без SSL
    location / {
        proxy_pass http://rails:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }

    location /cable {
        proxy_pass http://rails:3000/cable;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
